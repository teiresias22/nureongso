name: Claude 대체 토큰 확인

# 제미나이가 막히면 넘어가는 Claude Code(llm.claude_code_call)가 CI 에서 CLAUDE_CODE_OAUTH_TOKEN 으로 답하는지
# 한 번 불러 본다. 수동 실행만. 토큰을 새로 넣었을 때(`claude setup-token`, 1년짜리) 돌린다.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: collector
      - run: npm install -g @anthropic-ai/claude-code@2.1.207
      - working-directory: collector
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -c "import llm; print('응답:', llm.claude_code_call('OK 두 글자만 답하라.', None))"
