name: 이행 근거 수집

# 공약 이행의 근거가 되는 두 가지를 최신으로 유지한다.
#   자치법규  단체장·교육감의 조례제도형 공약 근거 (법제처)
#   입찰공고  예산사업형 공약 근거이자 지역구 발주 목록 (조달청 나라장터)
#
# 법안(ingest.yml)과 달리 매일 돌리지 않는다. 조례는 주 단위로 몇백 건이고 공고도
# 하루치를 몰아 받으면 되므로 주 1회로 충분하다. 다만 **최근 45일을 겹쳐 받는다** —
# 시행일자·공고일이 뒤늦게 붙거나 고쳐지는 건이 있어서, 지난주 것만 받으면 샌다.
# 전부 upsert 라 겹쳐 받아도 행이 늘지 않는다.
#
# 공약 분류(classify)와 대조(match·match_ordin·match_bid)도 돌린다. 처음엔 LLM
# 한도 때문에 손으로 돌렸는데, 그러다 classify 를 대조보다 나중에 돌려서 새로
# 유형이 붙은 공약 5,262건이 영원히 대조되지 않는 구멍이 생겼다. 순서를 여기에
# 박아 두면 그 실수를 되풀이하지 않는다.
#
# 한도는 걱정할 만큼 쓰지 않는다. 네 단계 모두 '아직 안 한 것' 만 집어서, 새
# 공약이 안 들어온 주에는 0건 호출한다. 선거 직후처럼 몰릴 때는 한도에서 깨끗이
# 멈추고 다음 주에 이어서 한다 (사람 단위로 기록이 남는다).
#
# 후보 간 공약 비교(match_race)는 넣지 않는다. 선거 때만 새로 생기고 표본 검증을
# 사람이 해야 한다.
on:
  schedule:
    - cron: "0 20 * * 0" # 매주 월요일 05:00 KST (UTC+9)
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전부터 다시 받을지"
        default: "45"

concurrency:
  group: evidence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 모델을 고정한다. 비워 두면 llm.py 가 쓸 수 있는 것 중 고르는데, 그 결과가 별칭
    # gemini-flash-lite-latest 라 구글이 가리키는 모델을 바꾸면 조용히 바뀐다 — 대조 재현성 지표가
    # 그만큼 흔들린다. 그 별칭이 가리키던 판(gemini-3.1-flash-lite)을 박는다.
    # 바꾸는 것은 따로 커밋한다(근거 행의 model 칸에 남아 바뀐 때가 보인다). race.yml 은 따로 고정.
    env:
      GEMINI_MODEL: gemini-3.1-flash-lite
    steps:
      # 규칙 판 적용 단계가 지난 판 커밋을 worktree 로 꺼낸다.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: collector

      - name: 기간 계산
        id: range
        run: echo "since=$(date -u -d "${{ inputs.days || '45' }} days ago" +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # 법제처(law.go.kr)는 가끔 접속이 통째로 막힌다. 첫 실행에서 4번 재시도가
      # 모두 ConnectTimeout 이었는데, 2분 뒤 같은 러너에서 437건을 9초에 받았다.
      # 일시적 장애다.
      #
      # 여기서 멈추면 입찰공고와 판정까지 건너뛴다. 조례가 한 주 밀리는 것보다
      # 그쪽이 나쁘다. 실패해도 다음 단계를 돌리고, 요약에 적는다.
      #
      # 계속 막히면 data.go.kr 중계로 옮긴다(1170000/law/ordinSearchList.do —
      # 활용신청 전이라 403 이지만 경로는 살아 있다). 그쪽이 더 안정적이라는 증거는
      # 아직 없다. 노후 경고가 반복해서 뜨면 그때 옮긴다.
      - name: 자치법규
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python ordin.py fetch --since "${{ steps.range.outputs.since }}"

      - name: 입찰공고
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python bid.py fetch --since "${{ steps.range.outputs.since }}"
          # 설계용역(공사의 앞 단계). 판정에는 쓰지 않는다 — 결정 J 를 세는 데만.
          python bid.py design --since "${{ steps.range.outputs.since }}"
          # 지역구-공사현장 대응표는 새 지역이 생겼을 수 있으니 매번 다시 만든다.
          python bid.py link

      # 시도지사 업무추진비. 시도 누리집 게시판을 곳마다 읽는다(collector/expense.py).
      # 사이트가 자주 바뀌니 한 곳이 깨져도 나머지는 받고, 이 단계가 실패해도 넘어간다.
      - name: 업무추진비
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python expense.py fetch

      # 아래 넷은 LLM 을 쓴다. 한도에 걸리면 QuotaExhausted 로 깨끗이 멈추고 다음
      # 주에 이어서 한다. 한 단계가 멈췄다고 판정까지 건너뛰지는 않는다.
      - name: 공약 분류
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python judge.py classify

      - name: 법안 대조
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python judge.py match

      - name: 조례 대조
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python judge.py match_ordin

      - name: 발주 대조
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python judge.py match_bid

      # 근거 기록(법안·조례·발주)의 버전. 판정 바로 앞에 둬야 판정 이력이 '어느 버전 때문인지' 를
      # 가리킨다. LLM 없음. 판정 이력 표가 없는 DB 면 실패하지만 판정은 그대로 돈다.
      - name: 근거 버전
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python judge.py snapshot

      # 규칙 판 적용(판정 계획 3.0 절차 R·T0.1). 근거 버전 뒤, 판정 앞. 판이 바뀌었으면 지난 판으로 먼저 한 주의
      # 입력 변화를 털어 내고(이력 사유 evidence·source·elapsed·input), 새 판을 적용한다(사유 rule). 그래서 이력의
      # 'rule' 은 규칙 변경만 가리킨다. 처음(none)은 털어 내고 지금 판을 기준으로 기록한다.
      # continue-on-error 를 두지 않는다 — 실패하면 아래 판정이 판 불일치로 멈추고 요약에 사유가 찍힌다.
      - name: 규칙 판 적용
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          state=$(python judge.py rule-prev) || exit 1
          case "$state" in
            none) python judge.py decide && python judge.py decide --rule ;;
            "")   echo "규칙 판 변경 없음" ;;
            *)    git worktree add "$RUNNER_TEMP/prev" "$state" \
                    && (cd "$RUNNER_TEMP/prev/collector" && python judge.py decide) \
                    && python judge.py decide --rule ;;
          esac

      - name: 판정 다시 적용
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python judge.py decide

      # 아래 둘은 LLM 을 쓴다. 판정과 무관하게 이어서 하고, 한도에 걸리면 다음 주가 잇는다.
      # quote: 근거마다 원문 구절(서버가 원문에서 다시 찾아 확인). repro: 표본 5명 대조 두 번.
      - name: 근거 원문 구절
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python judge.py quote

      - name: 대조 재현성 표본
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python judge.py repro --n 5

      - name: 결과 요약
        if: always()
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c, c.cursor() as cur:
              print("| 표 | 행수 | 최근 |")
              print("|---|---|---|")
              cur.execute("select count(*), max(effective_at) from ordinance")
              n, last = cur.fetchone()
              print(f"| 자치법규 | {n:,} | 시행 {last} |")
              cur.execute("select count(*), max(notice_at) from bid_notice")
              n2, last2 = cur.fetchone()
              print(f"| 입찰공고 | {n2:,} | {last2} |")
              cur.execute("select count(*), count(distinct org), max(used_at)::date from head_expense")
              n3, orgs3, last3 = cur.fetchone()
              print(f"| 업무추진비 | {n3:,} ({orgs3}개 시도) | {last3} |")
              # 자치법규가 몇 주째 안 들어오면 조용히 낡아가는 것이다. 눈에 띄게 적는다.
              #
              # 판단은 effective_at 이 아니라 **수집 기록**으로 한다. 시행일자는
              # 앞날짜가 들어 있어(예: 20261007) 언제 봐도 최신으로 보인다.
              cur.execute("""select max(finished_at) from ingest_run
                             where source = 'ordin'""")
              ran = cur.fetchone()[0]
              print(f"\n자치법규 마지막 수집: {ran or '없음'}")
              from datetime import datetime, timedelta, timezone
              if not ran or ran < datetime.now(timezone.utc) - timedelta(days=14):
                  print("\n> **자치법규가 2주 넘게 안 들어왔습니다.**"
                        " law.go.kr 접속이 계속 막히는 것일 수 있습니다."
                        " 반복되면 data.go.kr 중계"
                        "(1170000/law/ordinSearchList.do)로 옮기세요.")
              # 이 둘이 0 이 아니면 한도에 걸려 멈춘 것이다. 다음 주에 이어서 한다.
              cur.execute("select count(*) from pledge where kinds is null")
              print(f"\n유형 없는 공약: {cur.fetchone()[0]:,}건")
              # run_match 와 같은 조건이어야 한다. 대표발의 법안이 없는 사람(단체장 등)은
              # 대조 대상이 아니라 기록도 안 남으니, 그 조건을 빼고 세면 342명이 늘
              # '안 된 사람' 으로 찍힌다.
              cur.execute("""select count(distinct p.member_code) from pledge p
                             where '입법' = any(p.kinds)
                               and exists (select 1 from bill_sponsor s
                                            where s.member_code = p.member_code and s.role = 'rep')
                               and not exists (select 1 from ingest_run r
                                               where r.source = 'match:' || p.member_code)""")
              print(f"법안 대조 안 된 사람: {cur.fetchone()[0]}명")
              cur.execute("select pg_size_pretty(pg_database_size(current_database()))")
              print(f"\nDB 용량: {cur.fetchone()[0]} / 무료 한도 500MB")
              cur.execute("""select status, count(*) from pledge_status
                             group by 1 order by 2 desc""")
              print("\n| 판정 | 건수 |")
              print("|---|---|")
              for st, n in cur.fetchall():
                  print(f"| {st} | {n:,} |")
          # 판정 근거 지표. 정의는 docs/superpowers/specs/2026-10-12-pledge-evidence-tracking.md ⑧.
          # 판정 이력·근거 버전 표가 없는 DB(적용 전)면 한 줄만 적고 넘어간다.
          import ingest, judge
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              try:
                  with c.cursor() as cur:
                      cur.execute("select count(distinct (kind, ref_id)) from pledge_evidence where kind in ('bill','ordin','bid')")
                      refs = cur.fetchone()[0]
                  miss, _ = judge.run_snapshot(c, check=True)
                  print(f"\n근거 버전 감지 누락: {miss:,} / {refs:,}건 (판정 직후 0 이어야 한다)")
                  # 불변식(판정 계획 §4). I6 이 판정 결정성 — 판정 직후 0 이어야 한다.
                  print(f"\n| 불변식 (규칙 판 {judge.RULE_VERSION}) | 건수 |")
                  print("|---|---|")
                  for key, label, n in judge.run_invariants(c):
                      print(f"| {key} {label} | {'—' if n is None else f'{n:,}'} |")
                  with c.cursor() as cur:
                      cur.execute("""select count(*) filter (where quote_ok), count(*), count(*) filter (where quote = '')
                                     from pledge_evidence
                                     where kind = 'bill' and model like 'gemini:%' and quote_ok is not null""")
                      ok, n, empty = cur.fetchone()
                      # 구절을 '완료' 조건에 넣을지는 이 비율을 몇 주 본 뒤 정한다(설계 열린 질문 1).
                      print(f"원문 일치율(AI 가 고른 법안 구절): {ok:,} / {n:,}" + (f" ({ok / n:.0%})" if n else "")
                            + f" · '해당 부분 없음' {empty:,} · 모델 {os.environ.get('GEMINI_MODEL') or '자동'}")
                      cur.execute("""select sum(rows), sum(split_part(source, ':', -1)::int) from ingest_run
                                     where source like 'repro:%' and finished_at > now() - interval '28 days'""")
                      same, seen = cur.fetchone()
                      print(f"대조 재현성(4주 표본): {same or 0} / {seen or 0}명 근거 집합 일치")
                      cur.execute("""select count(*) filter (where error is not null or finished_at is null), count(*)
                                     from ingest_run
                                     where split_part(source, ':', 1) = any(%s) and started_at > now() - interval '28 days'""",
                                  (list(ingest.STEPS),))
                      bad, runs = cur.fetchone()
                      print(f"수집 실패(ingest.py 4주): {bad:,} / {runs:,}회")
                      cur.execute("""select count(*) filter (where cardinality(versions) > 0), count(*),
                                            count(*) filter (where at > now() - interval '7 days')
                                     from pledge_status_log
                                     where prev_status is not null and prev_status <> status and status in ('완료','진행')""")
                      linked, ups, week = cur.fetchone()
                      print(f"완료·진행으로 바뀐 판정 중 근거 버전이 있는 것: {linked:,} / {ups:,}건 (이번 주 {week:,}건)")
                      cur.execute("""select coalesce(prev_status, '') || '·' || coalesce(prev_note, '') || ' → '
                                            || status || '·' || coalesce(note, ''), count(*)
                                     from pledge_status_log where reason = 'rule' and at > now() - interval '12 hours'
                                     group by 1 order by 2 desc""")
                      rule = cur.fetchall()
                      cur.execute("select source from ingest_run where source like 'rule:%' order by id desc limit 1")
                      last = cur.fetchone()
                      print(f"규칙 판 적용 기록: {last[0] if last else '없음'} · 이번 실행 'rule' 전이 "
                            + (" · ".join(f"{k} {n:,}" for k, n in rule) or "0"))
                      cur.execute("""select reason, count(*) from pledge_status_log
                                     where at > now() - interval '7 days' group by 1 order by 2 desc""")
                      print("이번 주 판정 이력: " + (" · ".join(f"{r} {n:,}" for r, n in cur.fetchall()) or "없음"))
              except psycopg.Error as e:
                  print(f"\n판정 근거 지표: 아직 잴 수 없음({type(e).__name__}) — schema.sql '공약 판정 이력' 적용 전")
          PY
