name: 이행 근거 수집

# 공약 이행의 근거가 되는 두 가지를 최신으로 유지한다.
#   자치법규  단체장·교육감의 조례제도형 공약 근거 (법제처)
#   입찰공고  예산사업형 공약 근거이자 지역구 발주 목록 (조달청 나라장터)
#
# 법안(ingest.yml)과 달리 매일 돌리지 않는다. 조례는 주 단위로 몇백 건이고 공고도
# 하루치를 몰아 받으면 되므로 주 1회로 충분하다. 다만 **최근 45일을 겹쳐 받는다** —
# 시행일자·공고일이 뒤늦게 붙거나 고쳐지는 건이 있어서, 지난주 것만 받으면 샌다.
# 전부 upsert 라 겹쳐 받아도 행이 늘지 않는다.
#
# 공약 분류(classify)와 대조(match·match_ordin·match_bid)도 돌린다. 처음엔 LLM
# 한도 때문에 손으로 돌렸는데, 그러다 classify 를 대조보다 나중에 돌려서 새로
# 유형이 붙은 공약 5,262건이 영원히 대조되지 않는 구멍이 생겼다. 순서를 여기에
# 박아 두면 그 실수를 되풀이하지 않는다.
#
# 한도는 걱정할 만큼 쓰지 않는다. 네 단계 모두 '아직 안 한 것' 만 집어서, 새
# 공약이 안 들어온 주에는 0건 호출한다. 선거 직후처럼 몰릴 때는 한도에서 깨끗이
# 멈추고 다음 주에 이어서 한다 (사람 단위로 기록이 남는다).
#
# 후보 간 공약 비교(match_race)는 넣지 않는다. 선거 때만 새로 생기고 표본 검증을
# 사람이 해야 한다.
on:
  schedule:
    - cron: "0 20 * * 0" # 매주 월요일 05:00 KST (UTC+9)
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전부터 다시 받을지"
        default: "45"

concurrency:
  group: evidence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: collector

      - name: 기간 계산
        id: range
        run: echo "since=$(date -u -d "${{ inputs.days || '45' }} days ago" +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # 법제처(law.go.kr)는 가끔 접속이 통째로 막힌다. 첫 실행에서 4번 재시도가
      # 모두 ConnectTimeout 이었는데, 2분 뒤 같은 러너에서 437건을 9초에 받았다.
      # 일시적 장애다.
      #
      # 여기서 멈추면 입찰공고와 판정까지 건너뛴다. 조례가 한 주 밀리는 것보다
      # 그쪽이 나쁘다. 실패해도 다음 단계를 돌리고, 요약에 적는다.
      #
      # 계속 막히면 data.go.kr 중계로 옮긴다(1170000/law/ordinSearchList.do —
      # 활용신청 전이라 403 이지만 경로는 살아 있다). 그쪽이 더 안정적이라는 증거는
      # 아직 없다. 노후 경고가 반복해서 뜨면 그때 옮긴다.
      - name: 자치법규
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python ordin.py fetch --since "${{ steps.range.outputs.since }}"

      - name: 입찰공고
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python bid.py fetch --since "${{ steps.range.outputs.since }}"
          # 지역구-공사현장 대응표는 새 지역이 생겼을 수 있으니 매번 다시 만든다.
          python bid.py link

      # 아래 넷은 LLM 을 쓴다. 한도에 걸리면 QuotaExhausted 로 깨끗이 멈추고 다음
      # 주에 이어서 한다. 한 단계가 멈췄다고 판정까지 건너뛰지는 않는다.
      - name: 공약 분류
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python judge.py classify

      - name: 법안 대조
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python judge.py match

      - name: 조례 대조
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python judge.py match_ordin

      - name: 발주 대조
        continue-on-error: true
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python judge.py match_bid

      - name: 판정 다시 적용
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python judge.py decide

      - name: 결과 요약
        if: always()
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c, c.cursor() as cur:
              print("| 표 | 행수 | 최근 |")
              print("|---|---|---|")
              cur.execute("select count(*), max(effective_at) from ordinance")
              n, last = cur.fetchone()
              print(f"| 자치법규 | {n:,} | 시행 {last} |")
              cur.execute("select count(*), max(notice_at) from bid_notice")
              n2, last2 = cur.fetchone()
              print(f"| 입찰공고 | {n2:,} | {last2} |")
              # 자치법규가 몇 주째 안 들어오면 조용히 낡아가는 것이다. 눈에 띄게 적는다.
              #
              # 판단은 effective_at 이 아니라 **수집 기록**으로 한다. 시행일자는
              # 앞날짜가 들어 있어(예: 20261007) 언제 봐도 최신으로 보인다.
              cur.execute("""select max(finished_at) from ingest_run
                             where source = 'ordin'""")
              ran = cur.fetchone()[0]
              print(f"\n자치법규 마지막 수집: {ran or '없음'}")
              from datetime import datetime, timedelta, timezone
              if not ran or ran < datetime.now(timezone.utc) - timedelta(days=14):
                  print("\n> **자치법규가 2주 넘게 안 들어왔습니다.**"
                        " law.go.kr 접속이 계속 막히는 것일 수 있습니다."
                        " 반복되면 data.go.kr 중계"
                        "(1170000/law/ordinSearchList.do)로 옮기세요.")
              # 이 둘이 0 이 아니면 한도에 걸려 멈춘 것이다. 다음 주에 이어서 한다.
              cur.execute("select count(*) from pledge where kinds is null")
              print(f"\n유형 없는 공약: {cur.fetchone()[0]:,}건")
              cur.execute("""select count(distinct p.member_code) from pledge p
                             where '입법' = any(p.kinds)
                               and not exists (select 1 from ingest_run r
                                               where r.source = 'match:' || p.member_code)""")
              print(f"법안 대조 안 된 사람: {cur.fetchone()[0]}명")
              cur.execute("select pg_size_pretty(pg_database_size(current_database()))")
              print(f"\nDB 용량: {cur.fetchone()[0]} / 무료 한도 500MB")
              cur.execute("""select status, count(*) from pledge_status
                             group by 1 order by 2 desc""")
              print("\n| 판정 | 건수 |")
              print("|---|---|")
              for st, n in cur.fetchall():
                  print(f"| {st} | {n:,} |")
          PY
