name: 후보 공약 비교 재생성

# 같은 선거구 후보 간 공약 비교(match_race)를 gemini-3.5-flash 로 다시 만든다.
#
# 2026-09-30 공약서 재적재로 쌍이 지워져 gemma-4-31b 로 급히 채웠다(표본 24/30).
# 3.5-flash 는 표본에서 틀린 쌍이 없었고 같은 선거구에서 두 배를 찾았지만, 무료 한도가
# 하루 20건이라 254곳을 한 번에 못 돈다. 매일 이어서 돌고, 2026-10-01 15:00Z(gemma 보충이 끝난 뒤) 뒤에 돈 선거구는
# 건너뛴다(--since). 다 돌면 호출이 0건이 된다 — 그때 표본을 보고 이 파일을 지운다.
on:
  schedule:
    # 매일 18:00 KST(태평양 02:00). 처음엔 06:00 KST 였는데 GitHub 예약이 세 시간쯤 밀려
    # 미국 오후(수요 최고)에 돌았고, 첫날 17건 중 15건이 503 이었다. 한도는 태평양 자정
    # (07:00~08:00 UTC)에 풀리니 그 뒤 미국이 조용한 시간에 돈다. 밀려도 다음 초기화 전이다.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: race
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: collector
      - name: 후보 공약 비교
        working-directory: collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
        run: python judge.py match_race --since 2026-10-01T15:00Z
